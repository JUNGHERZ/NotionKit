# ============================================================
# NotionKit – Build Smoke Test
#
# Trigger:  push / pull request on main
# Purpose:  notionkit.min.css and notionkit-styles.js are gitignored and
#           only produced by the release workflow. A syntax error in
#           notionkit.css, or a token declaration leaking into the
#           component block, would otherwise surface at tag time. This
#           job builds on every push and runs the split checks, the
#           documentation coverage check, the version consistency
#           check and the regression tests in test/ (Chromium).
#
# Locally:  npm run build && npm run check:coverage && npm test
# ============================================================

name: Verify Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build artifacts from source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (minify, split, pages, SKILL.md)
        run: npm run build

      - name: Documentation covers every class
        run: npm run check:coverage

      - name: Every version reference agrees with package.json
        run: npm run check:versions

      - name: The package carries every file it points to
        run: npm run check:package

      - name: Artifacts exist and carry the package version
        run: |
          set -e
          test -s notionkit.min.css    || { echo "::error::notionkit.min.css missing or empty"; exit 1; }
          test -s notionkit-styles.js  || { echo "::error::notionkit-styles.js missing or empty"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          grep -q "NotionKit v${VERSION}" notionkit-styles.js \
            || { echo "::error::notionkit-styles.js header does not say v${VERSION}"; exit 1; }
          grep -q "v${VERSION}" notionkit.css \
            || { echo "::error::notionkit.css header does not say v${VERSION}"; exit 1; }
          grep -q "(v${VERSION})" SKILL.md \
            || { echo "::error::SKILL.md does not say v${VERSION}"; exit 1; }
          echo "OK – artifacts built for v${VERSION}"

      - name: CHANGELOG has an entry for this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "## \[${VERSION}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${VERSION} – add '## [${VERSION}] – YYYY-MM-DD' before releasing"; exit 1; }

      - name: Size budget (≤ 18 KB gzip) and README size claims
        run: npm run check:size

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Regression tests
        run: npm test

      - name: Upload test artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test/.artifacts/
          retention-days: 7
