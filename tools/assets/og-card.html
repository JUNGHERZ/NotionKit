<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../notionkit.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--nk-bg-sidebar); font-family: var(--nk-font); color: var(--nk-text); }
  .card { position: relative; width: 1200px; height: 630px; }
  .text { position: absolute; left: 72px; top: 96px; width: 480px; }
  .mark { width: 56px; height: 56px; border-radius: 13px; background: linear-gradient(135deg, var(--nk-decor-purple), var(--nk-decor-blue)); color: #fff; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 26px; }
  h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin: 0 0 18px; }
  p { font-size: 21px; line-height: 1.45; color: var(--nk-text-secondary); margin: 0 0 26px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tags .nk-tag { font-size: 15px; padding: 3px 12px; }
  .shot { position: absolute; left: 600px; top: 58px; width: 1000px; height: 640px; transform: scale(.72); transform-origin: top left;
          border: 1px solid var(--nk-border-strong); border-radius: 14px; overflow: hidden; box-shadow: var(--nk-shadow-menu); background: var(--nk-bg); }
  .shot iframe { width: 1000px; height: 640px; border: 0; }
  .bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--nk-border); background: var(--nk-bg-sidebar); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--nk-border-strong); }
  .foot { position: absolute; left: 72px; bottom: 44px; font-size: 16px; color: var(--nk-text-tertiary); }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="mark">N</div>
    <h1>NotionKit</h1>
    <p>The calm workspace look, as a CSS design system. ~100 components, light &amp; dark, no build step.</p>
    <div class="tags"><span class="nk-tag blue">CSS only</span><span class="nk-tag green">Design tokens</span><span class="nk-tag purple">Shadow DOM ready</span><span class="nk-tag orange">7 KB gzip</span></div>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><iframe src="../../app.html" onload="this.contentWindow.postMessage({nkTheme:'light'},'*')"></iframe></div>
  <div class="foot">notionkit.jungherz.com · MIT · Jungherz GmbH</div>
</div>
</body>
</html>
